<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOX Trading Harness Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #020617; font-family: 'JetBrains Mono', monospace; color: #e2e8f0; }
  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
  h1 { text-align: center; font-size: 28px; margin-bottom: 8px; color: #f8fafc; }
  p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 32px; font-size: 14px; }
  svg { display: block; margin: 0 auto; }
  .legend { display: flex; justify-content: center; gap: 24px; margin-top: 24px; flex-wrap: wrap; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>
<div class="container">
  <h1>VOX 6-Layer Trading Harness</h1>
  <p class="subtitle">Mandatory checklist before any buy/sell recommendation</p>

  <svg width="1100" height="760" viewBox="0 0 1100 760">
    <!-- Background grid -->
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0f172a" stroke-width="1"/>
      </pattern>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
      </marker>
    </defs>
    <rect width="1100" height="760" fill="#020617"/>
    <rect width="1100" height="760" fill="url(#grid)"/>

    <!-- Title box -->
    <rect x="380" y="20" width="340" height="50" rx="8" fill="rgba(30,41,59,0.6)" stroke="#38bdf8" stroke-width="2"/>
    <text x="550" y="52" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="700">Cross-Layer Synthesis Engine</text>

    <!-- Layer 0: Data Audit -->
    <rect x="20" y="100" width="200" height="90" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="120" y="130" text-anchor="middle" fill="#fb7185" font-size="13" font-weight="700">L0: Data Audit</text>
    <text x="120" y="155" text-anchor="middle" fill="#e2e8f0" font-size="11">Railway Postgres</text>
    <text x="120" y="175" text-anchor="middle" fill="#94a3b8" font-size="10">positions + watchlist</text>

    <!-- Layer boxes 1-6 -->
    <rect x="260" y="100" width="240" height="90" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="380" y="130" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">L1: Portfolio State</text>
    <text x="380" y="155" text-anchor="middle" fill="#e2e8f0" font-size="11">AUM, sectors, gaps</text>
    <text x="380" y="175" text-anchor="middle" fill="#94a3b8" font-size="10">70 positions, $185K</text>

    <rect x="520" y="100" width="240" height="90" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="640" y="130" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">L2: Famous Traders</text>
    <text x="640" y="155" text-anchor="middle" fill="#e2e8f0" font-size="11">80 tickers, cross-trader overlap</text>
    <text x="640" y="175" text-anchor="middle" fill="#94a3b8" font-size="10">78 missing from portfolio</text>

    <rect x="780" y="100" width="240" height="90" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="900" y="130" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">L3: Supply Chain</text>
    <text x="900" y="155" text-anchor="middle" fill="#e2e8f0" font-size="11">AI Infra, Quantum, Space, Nuclear</text>
    <text x="900" y="175" text-anchor="middle" fill="#94a3b8" font-size="10">Best-of-sector leaders</text>

    <rect x="260" y="220" width="240" height="90" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="380" y="250" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">L4: Weather Patterns</text>
    <text x="380" y="275" text-anchor="middle" fill="#e2e8f0" font-size="11">NOAA alerts → sector impact</text>
    <text x="380" y="295" text-anchor="middle" fill="#94a3b8" font-size="10">Heat, hurricane, drought, flood</text>

    <rect x="520" y="220" width="240" height="90" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="640" y="250" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">L5: Macro Trends</text>
    <text x="640" y="275" text-anchor="middle" fill="#e2e8f0" font-size="11">VIX, yields, DXY, Fed</text>
    <text x="640" y="295" text-anchor="middle" fill="#94a3b8" font-size="10">Bull / Bear / Volatile regime</text>

    <rect x="780" y="220" width="240" height="90" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="900" y="250" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">L6: Technical + Fundamental</text>
    <text x="900" y="275" text-anchor="middle" fill="#e2e8f0" font-size="11">yfinance live data</text>
    <text x="900" y="295" text-anchor="middle" fill="#94a3b8" font-size="10">P/E, RSI, SMA, growth</text>

    <!-- Arrows to synthesis -->
    <line x1="380" y1="190" x2="550" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="640" y1="190" x2="580" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="900" y1="190" x2="610" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="380" y1="310" x2="550" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="640" y1="310" x2="580" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="900" y1="310" x2="610" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Synthesis box -->
    <rect x="420" y="360" width="260" height="100" rx="8" fill="rgba(30,41,59,0.7)" stroke="#38bdf8" stroke-width="2"/>
    <text x="550" y="395" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">Cross-Layer Synthesis</text>
    <text x="550" y="420" text-anchor="middle" fill="#e2e8f0" font-size="11">composite = (layers_hit × 10) + grade</text>
    <text x="550" y="445" text-anchor="middle" fill="#94a3b8" font-size="10">Filter: grade ≥60, composite ≥70, RSI &lt;75</text>

    <!-- Outputs -->
    <rect x="120" y="520" width="180" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="210" y="555" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">BUY Candidates</text>
    <text x="210" y="580" text-anchor="middle" fill="#e2e8f0" font-size="11">Top 5 cross-layer winners</text>

    <rect x="340" y="520" width="180" height="80" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="430" y="555" text-anchor="middle" fill="#fb7185" font-size="13" font-weight="700">SELL Candidates</text>
    <text x="430" y="580" text-anchor="middle" fill="#e2e8f0" font-size="11">Grade &lt;45 or council SELL</text>

    <rect x="560" y="520" width="180" height="80" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="650" y="555" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="700">TRIM Candidates</text>
    <text x="650" y="580" text-anchor="middle" fill="#e2e8f0" font-size="11">Grade ≥80, up &gt;100%</text>

    <rect x="780" y="520" width="180" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="870" y="555" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">WATCH List</text>
    <text x="870" y="580" text-anchor="middle" fill="#e2e8f0" font-size="11">Composite 55-69</text>

    <!-- Arrows to outputs -->
    <line x1="500" y1="460" x2="210" y2="520" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="530" y1="460" x2="430" y2="520" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="570" y1="460" x2="650" y2="520" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="600" y1="460" x2="870" y2="520" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Recommendation format -->
    <rect x="150" y="640" width="800" height="90" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="550" y="670" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Final Recommendation Format</text>
    <text x="550" y="695" text-anchor="middle" fill="#94a3b8" font-size="11">Ticker | Action | Entry | Stop | Target | Shares | Broker | Timeline | Thesis | Layers Fired</text>
    <text x="550" y="715" text-anchor="middle" fill="#fb7185" font-size="10" font-weight="600">NO VAGUE RECOMMENDATIONS. Exact numbers only.</text>

    <!-- Cadence -->
    <rect x="20" y="360" width="180" height="120" rx="6" fill="rgba(30,41,59,0.4)" stroke="#64748b" stroke-width="1.5"/>
    <text x="110" y="390" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">Review Cadence</text>
    <text x="110" y="420" text-anchor="middle" fill="#e2e8f0" font-size="11">Daily: Alerts + signals</text>
    <text x="110" y="445" text-anchor="middle" fill="#e2e8f0" font-size="11">Weekly: Top 3 plays</text>
    <text x="110" y="470" text-anchor="middle" fill="#e2e8f0" font-size="11">Monthly: Full re-grade</text>
  </svg>

  <div class="legend">
    <div class="legend-item"><div class="dot" style="background:#22d3ee"></div>Data / Analysis</div>
    <div class="legend-item"><div class="dot" style="background:#34d399"></div>Conviction / Buy</div>
    <div class="legend-item"><div class="dot" style="background:#a78bfa"></div>Sector Intelligence</div>
    <div class="legend-item"><div class="dot" style="background:#fbbf24"></div>Macro / Weather</div>
    <div class="legend-item"><div class="dot" style="background:#fb7185"></div>Risk / Audit</div>
    <div class="legend-item"><div class="dot" style="background:#fb923c"></div>Trim / Action</div>
  </div>
</div>
</body>
</html>
